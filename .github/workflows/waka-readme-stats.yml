name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *' # Chạy mỗi ngày một lần
  workflow_dispatch: # Cho phép bấm chạy thủ công

permissions:
  contents: write

concurrency:
  group: waka-readme-stats
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update WakaTime statistics
        env:
          # Personal OAuth token from https://wakatime.com/oauth, with read_stats permission.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/update_wakatime.py
      - name: Commit and push updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(readme): update WakaTime statistics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
