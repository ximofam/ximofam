name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *' # Chạy mỗi ngày một lần
  workflow_dispatch: # Cho phép bấm chạy thủ công

permissions:
  contents: write

concurrency:
  group: waka-readme-stats
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Hiển thị Timezone
          SHOW_TIMEZONE: "True"
          USER_TIMEZONE: "Asia/Ho_Chi_Minh"

          # Thống kê thời gian lập trình từ WakaTime (Languages, Editors, OS)
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_TIME_ELAPSED: "True"

          # Bộ ký tự progress bar (█ và ░) chuẩn theo mẫu của bạn
          SYMBOL_VERSION: "1"


          SHOW_PROJECTS: "False"             # Ẩn danh sách dự án / repository
          SHOW_LINES_OF_CODE: "False"        # Ẩn dòng thống kê Lines of Code
          SHOW_PROFILE_VIEWS: "False"        # Ẩn số lượt xem Profile
          SHOW_SHORT_INFO: "False"           # Ẩn thông tin tổng quan account/storage
          SHOW_LANGUAGE_PER_REPO: "False"    # Ẩn chi tiết ngôn ngữ từng repo
          SHOW_LOC_CHART: "False"            # Ẩn biểu đồ LOC
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_AI_CODING: "False"
          SHOW_AI_CODE_TIME: "False"
